$schema: https://json-schema.org/draft/2020-12/schema
$id: https://floe.local/schema/entity.schema.yaml
allOf:
- $ref: '#/$defs/entity_base'
- required:
  - name
  - schema
- $ref: '#/$defs/local_evolution_sink'
- properties:
    name:
      pattern: ^[^./\\]+$
    domain:
      pattern: ^[^./\\]+$
title: Floe entity document
$defs:
  entity_base:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      metadata:
        $ref: '#/$defs/entity_metadata'
      domain:
        type: string
      incremental_mode:
        type: string
        enum:
        - none
        - archive
        - file
        - row
      state:
        $ref: '#/$defs/entity_state'
      source:
        $ref: '#/$defs/source_fragment'
      sink:
        $ref: '#/$defs/sink_fragment'
      policy:
        $ref: '#/$defs/policy_fragment'
      schema:
        $ref: '#/$defs/schema'
      pii:
        $ref: '#/$defs/pii_fragment'
    allOf:
    - $ref: '#/$defs/pii_safety'
    - if:
        required:
        - incremental_mode
        - sink
        properties:
          incremental_mode:
            enum:
            - file
            - row
          sink:
            required:
            - archive
      then:
        not: {}
    - if:
        required:
        - source
        properties:
          source:
            required:
            - format
            properties:
              format:
                const: fixed
      then:
        properties:
          schema:
            properties:
              columns:
                items:
                  required:
                  - width
    - if:
        required:
        - source
        properties:
          source:
            required:
            - format
            properties:
              format:
                const: xlsx
      then:
        properties:
          source:
            properties:
              options:
                properties:
                  sheet:
                    pattern: \S
    - if:
        required:
        - source
        properties:
          source:
            required:
            - format
            properties:
              format:
                const: json
      then:
        properties:
          schema:
            properties:
              columns:
                maxItems: 1024
  entity_metadata:
    type: object
    additionalProperties: true
    properties:
      data_product:
        type: string
      domain:
        type: string
      owner:
        type: string
      description:
        type: string
      tags:
        type: array
        items:
          type: string
  entity_state:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
        pattern: \S
  source_fragment:
    type: object
    additionalProperties: false
    dependentRequired:
      resource:
      - ref
    properties:
      ref:
        type: string
      resource:
        type: string
      format:
        type: string
        enum:
        - csv
        - tsv
        - fixed
        - parquet
        - json
        - xlsx
        - orc
        - avro
        - xml
      path:
        type: string
      storage:
        type: string
      options:
        $ref: '#/$defs/source_options'
      cast_mode:
        type: string
        enum:
        - strict
        - coerce
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  source_options:
    type: object
    additionalProperties: false
    properties:
      header:
        type: boolean
      separator:
        type: string
      encoding:
        type: string
      null_values:
        type: array
        items:
          type: string
      recursive:
        type: boolean
      glob:
        type: string
      json_mode:
        type: string
        enum:
        - array
        - ndjson
      sheet:
        type: string
      header_row:
        type: integer
        minimum: 1
      data_row:
        type: integer
        minimum: 1
      row_tag:
        type: string
      namespace:
        type: string
      value_tag:
        type: string
  sink_fragment:
    type: object
    additionalProperties: false
    properties:
      write_mode:
        type: string
        enum:
        - overwrite
        - append
        - merge_scd1
        - merge_scd2
      accepted:
        $ref: '#/$defs/sink_accepted_fragment'
      rejected:
        $ref: '#/$defs/sink_rejected_fragment'
      archive:
        $ref: '#/$defs/archive_target'
  sink_accepted_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum:
        - parquet
        - delta
        - iceberg
        - duckdb
      path:
        type: string
      storage:
        type: string
      options:
        type: object
        additionalProperties: false
        properties:
          compression:
            type: string
            enum:
            - snappy
            - gzip
            - zstd
            - uncompressed
          row_group_size:
            type: integer
            minimum: 1
          max_size_per_file:
            type: integer
            minimum: 1
      filesystem:
        type: string
      merge:
        $ref: '#/$defs/merge'
      iceberg:
        $ref: '#/$defs/iceberg'
      delta:
        $ref: '#/$defs/delta'
      duckdb:
        $ref: '#/$defs/duckdb'
      partition_by:
        type: array
        items:
          type: string
        minItems: 1
      partition_spec:
        type: array
        items:
          $ref: '#/$defs/partition_field'
        minItems: 1
    allOf:
    - not:
        required:
        - storage
        - filesystem
  merge:
    type: object
    additionalProperties: false
    properties:
      ignore_columns:
        type: array
        items:
          type: string
      compare_columns:
        type: array
        items:
          type: string
      scd2:
        $ref: '#/$defs/merge_scd2'
  merge_scd2:
    type: object
    additionalProperties: false
    properties:
      current_flag_column:
        type: string
        pattern: '\S'
      valid_from_column:
        type: string
        pattern: '\S'
      valid_to_column:
        type: string
        pattern: '\S'
  iceberg:
    type: object
    additionalProperties: false
    properties:
      catalog:
        type: string
      namespace:
        type: string
      table:
        type: string
      location:
        type: string
  delta:
    type: object
    additionalProperties: false
    properties:
      catalog:
        type: string
      schema:
        type: string
      table:
        type: string
  duckdb:
    type: object
    additionalProperties: false
    properties:
      table:
        type: string
        pattern: \S
      schema:
        type: string
      connection:
        type: string
        anyOf:
        - pattern: '^\s*md:'
        - pattern: ^\s*$
      token:
        type: string
  partition_field:
    type: object
    additionalProperties: false
    properties:
      column:
        type: string
      transform:
        type: string
        enum:
        - identity
        - year
        - month
        - day
        - hour
    required:
    - column
  sink_rejected_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum:
        - csv
      path:
        type: string
      storage:
        type: string
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  archive_target:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
      storage:
        type: string
  policy_fragment:
    type: object
    additionalProperties: false
    properties:
      severity:
        type: string
        enum:
        - warn
        - reject
        - abort
  schema:
    type: object
    additionalProperties: false
    required:
    - columns
    properties:
      normalize_columns:
        $ref: '#/$defs/normalize_columns'
      mismatch:
        $ref: '#/$defs/schema_mismatch'
      schema_evolution:
        $ref: '#/$defs/schema_evolution'
      primary_key:
        type: array
        minItems: 1
        items:
          type: string
      unique_keys:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            type: string
      columns:
        type: array
        items:
          $ref: '#/$defs/column'
  normalize_columns:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      strategy:
        type: string
        enum:
        - snake_case
        - lower
        - camel_case
        - none
  schema_mismatch:
    type: object
    additionalProperties: false
    properties:
      missing_columns:
        type: string
        enum:
        - reject_file
        - fill_nulls
      extra_columns:
        type: string
        enum:
        - reject_file
        - ignore
  schema_evolution:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum:
        - strict
        - add_columns
      on_incompatible:
        type: string
        enum:
        - fail
  column:
    type: object
    additionalProperties: false
    required:
    - name
    - type
    properties:
      name:
        type: string
      source:
        type: string
      type:
        type: string
        pattern: '^(?:[sS][_-]*[tT][_-]*[rR][_-]*[iI][_-]*[nN][_-]*[gG][_-]*|[sS][_-]*[tT][_-]*[rR][_-]*|[tT][_-]*[eE][_-]*[xX][_-]*[tT][_-]*|[bB][_-]*[oO][_-]*[oO][_-]*[lL][_-]*[eE][_-]*[aA][_-]*[nN][_-]*|[bB][_-]*[oO][_-]*[oO][_-]*[lL][_-]*|[iI][_-]*[nN][_-]*[tT][_-]*8[_-]*|[iI][_-]*[nN][_-]*[tT][_-]*1[_-]*6[_-]*|[iI][_-]*[nN][_-]*[tT][_-]*3[_-]*2[_-]*|[iI][_-]*[nN][_-]*[tT][_-]*6[_-]*4[_-]*|[iI][_-]*[nN][_-]*[tT][_-]*|[iI][_-]*[nN][_-]*[tT][_-]*[eE][_-]*[gG][_-]*[eE][_-]*[rR][_-]*|[lL][_-]*[oO][_-]*[nN][_-]*[gG][_-]*|[uU][_-]*[iI][_-]*[nN][_-]*[tT][_-]*8[_-]*|[uU][_-]*[iI][_-]*[nN][_-]*[tT][_-]*1[_-]*6[_-]*|[uU][_-]*[iI][_-]*[nN][_-]*[tT][_-]*3[_-]*2[_-]*|[uU][_-]*[iI][_-]*[nN][_-]*[tT][_-]*6[_-]*4[_-]*|[fF][_-]*[lL][_-]*[oO][_-]*[aA][_-]*[tT][_-]*3[_-]*2[_-]*|[fF][_-]*[lL][_-]*[oO][_-]*[aA][_-]*[tT][_-]*6[_-]*4[_-]*|[fF][_-]*[lL][_-]*[oO][_-]*[aA][_-]*[tT][_-]*|[dD][_-]*[oO][_-]*[uU][_-]*[bB][_-]*[lL][_-]*[eE][_-]*|[nN][_-]*[uU][_-]*[mM][_-]*[bB][_-]*[eE][_-]*[rR][_-]*|[dD][_-]*[eE][_-]*[cC][_-]*[iI][_-]*[mM][_-]*[aA][_-]*[lL][_-]*|[dD][_-]*[aA][_-]*[tT][_-]*[eE][_-]*|[dD][_-]*[aA][_-]*[tT][_-]*[eE][_-]*[tT][_-]*[iI][_-]*[mM][_-]*[eE][_-]*|[tT][_-]*[iI][_-]*[mM][_-]*[eE][_-]*[sS][_-]*[tT][_-]*[aA][_-]*[mM][_-]*[pP][_-]*|[tT][_-]*[iI][_-]*[mM][_-]*[eE][_-]*)$'
      nullable:
        type: boolean
      unique:
        type: boolean
      width:
        type: integer
        minimum: 1
      trim:
        type: boolean
  pii_fragment:
    type: object
    additionalProperties: false
    properties:
      columns:
        type: array
        items:
          $ref: '#/$defs/pii_column'
  pii_column:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      mask_pattern:
        type: string
      redact_value:
        type: string
      key:
        type: string
      strategy:
        type: string
        enum:
        - hash
        - drop
        - nullify
        - redact
        - mask
    required:
    - name
    - strategy
    allOf:
    - if:
        properties:
          strategy:
            const: mask
      then:
        required:
        - mask_pattern
        properties:
          mask_pattern:
            anyOf:
            - pattern: ^(?:(?!\{first)[\s\S])*\{first\+?0*[1-9][0-9]*\}
            - pattern: ^(?:(?!\{last)[\s\S])*\{last\+?0*[1-9][0-9]*\}
  local_evolution_sink:
    if:
      required:
      - schema
      - sink
      properties:
        schema:
          required:
          - schema_evolution
          properties:
            schema_evolution:
              required:
              - mode
              properties:
                mode:
                  const: add_columns
        sink:
          required:
          - accepted
          properties:
            accepted:
              required:
              - format
    then:
      properties:
        sink:
          properties:
            accepted:
              properties:
                format:
                  const: delta
  pii_safety:
    allOf:
    - if:
        required:
        - pii
      then:
        properties:
          policy:
            properties:
              severity:
                not:
                  const: abort
          sink:
            not:
              required:
              - archive
          schema:
            properties:
              mismatch:
                properties:
                  missing_columns:
                    not:
                      const: reject_file
                  extra_columns:
                    not:
                      const: reject_file
    - if:
        required:
        - pii
        - sink
        properties:
          sink:
            required:
            - accepted
            properties:
              accepted:
                required:
                - format
                properties:
                  format:
                    enum:
                    - delta
                    - iceberg
      then:
        properties:
          pii:
            properties:
              columns:
                items:
                  properties:
                    strategy:
                      not:
                        const: drop
