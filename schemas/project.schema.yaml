          duckdb:
            required:
            - connection
            - table
            properties:
              connection:
                pattern: '^\s*md:'
                type: string
    - if:
        required:
        - duckdb
      then:
        properties:
          format:
            const: duckdb
          duckdb:
            required:
            - table
    - if:
        required:
        - format
        properties:
          format:
            const: duckdb
      then:
        required:
        - duckdb
        properties:
          duckdb:
            required:
            - table
    - if:
