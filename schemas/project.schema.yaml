              namespace:
                pattern: \S
              value_tag:
                pattern: \S
    - if:
        required:
        - format
        properties:
          format:
            enum:
            - csv
            - tsv
      then:
        properties:
          options:
            properties:
              encoding:
                pattern: ^[_-]*(?:[uU][_-]*[tT][_-]*[fF][_-]*8[_-]*|[lL][_-]*[oO][_-]*[sS][_-]*[sS][_-]*[yY][_-]*[uU][_-]*[tT][_-]*[fF][_-]*8[_-]*)$
              separator:
                pattern: ^[\x00-\x7F]$
    - if:
        required:
        - format
