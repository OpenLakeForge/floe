      then:
        properties:
          write_mode:
            type: string
            pattern: ^\s*(?:[mM][eE][rR][gG][eE]_[sS][cC][dD]2)\s*$
    - if:
        required:
        - accepted
        properties:
          accepted:
            properties:
              format:
                enum:
                - parquet
                - iceberg
      then:
        properties:
          write_mode:
