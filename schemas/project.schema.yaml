            type: string
      else:
        not:
          required:
          - resource
    - not:
        required:
        - storage
        - filesystem
        properties:
          storage:
            not:
              type: 'null'
          filesystem:
            not:
              type: 'null'
    - if:
        required:
        - format
        properties:
          format:
            const: xml
        not:
          required:
          - ref
      then:
        required:
        - options
        properties:
          options:
            required:
            - row_tag
            properties:
              row_tag:
                pattern: \S
