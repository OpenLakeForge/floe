$schema: https://json-schema.org/draft/2020-12/schema
$id: https://floe.local/schema/project.schema.yaml
type: object
additionalProperties: false
required:
- version
allOf:
- if:
    properties:
      version:
        pattern: ^\+?0+\.\+?0*[12]$
  then:
    required:
    - entities
    properties:
      entities:
        type: array
        items:
          allOf:
          - $ref: '#/$defs/entity'
          - properties:
              source:
                not:
                  anyOf:
                  - required:
                    - ref
                  - required:
                    - resource
      domains:
        type: array
        items:
          $ref: '#/$defs/domain_legacy'
    not:
      anyOf:
      - required:
        - sources
      - required:
        - include
- if:
    properties:
      version:
        type: string
    not:
      properties:
        version:
          pattern: ^\+?0+\.\+?0*[12]$
  then:
    properties:
      entities:
        type: array
        items:
          $ref: '#/$defs/inline_entity'
    anyOf:
    - required:
      - entities
    - required:
      - include
      properties:
        include:
          required:
          - domains
          properties:
            domains:
              minItems: 1
    not:
      required:
      - sources
      - include
      properties:
        include:
          required:
          - sources
- if:
    properties:
      version:
        pattern: ^\+?0+\.\+?0*1$
  then:
    properties:
      entities:
        items:
          properties:
            schema:
              not:
                required:
                - schema_evolution
- not:
    required:
    - storages
    - filesystems
properties:
  version:
    type: string
    pattern: ^\+?[0-9]+\.\+?[0-9]+$
    not:
      pattern: ^\+?0+\.\+?0+$
  metadata:
    $ref: '#/$defs/project_metadata'
  storages:
    $ref: '#/$defs/storages'
  env:
    $ref: '#/$defs/env'
  domains:
    $ref: '#/$defs/domains'
  sources:
    $ref: '#/$defs/source_definitions'
  include:
    $ref: '#/$defs/include'
  report:
    $ref: '#/$defs/report'
  entities:
    type: array
    items:
      $ref: '#/$defs/inline_entity'
    minItems: 1
  filesystems:
    $ref: '#/$defs/storages'
  catalogs:
    $ref: '#/$defs/catalogs'
  lineage:
    $ref: '#/$defs/lineage'
title: Floe project configuration
description: A complete inline config or project root. Fields follow RootConfig and the YAML parser. Cross-file
  reference resolution and merged validation are performed by floe validate.
$defs:
  entity:
    allOf:
    - $ref: '#/$defs/entity_base'
    - required:
      - name
      - source
      - sink
      - policy
      - schema
    - properties:
        source:
          $ref: '#/$defs/source'
        sink:
          $ref: '#/$defs/sink'
        policy:
          $ref: '#/$defs/policy'
        pii:
          $ref: '#/$defs/pii'
    - oneOf:
      - $ref: '#/$defs/entity_reject'
      - $ref: '#/$defs/entity_non_reject'
    - $ref: '#/$defs/local_evolution_sink'
    - if:
        required:
        - incremental_mode
        properties:
          incremental_mode:
            const: archive
      then:
        properties:
          sink:
            required:
            - archive
    - if:
        required:
        - incremental_mode
        properties:
          incremental_mode:
            enum:
            - file
            - row
      then:
        properties:
          sink:
            not:
              required:
              - archive
    - if:
        required:
        - sink
        properties:
          sink:
            required:
            - write_mode
            properties:
              write_mode:
                enum:
                - merge_scd1
                - merge_scd2
      then:
        properties:
          schema:
            required:
            - primary_key
  entity_base:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      metadata:
        $ref: '#/$defs/entity_metadata'
      domain:
        type: string
      incremental_mode:
        type: string
        enum:
        - none
        - archive
        - file
        - row
      state:
        $ref: '#/$defs/entity_state'
      source:
        $ref: '#/$defs/source_fragment'
      sink:
        $ref: '#/$defs/sink_fragment'
      policy:
        $ref: '#/$defs/policy_fragment'
      schema:
        $ref: '#/$defs/schema'
      pii:
        $ref: '#/$defs/pii_fragment'
  entity_metadata:
    type: object
    additionalProperties: false
    properties:
      data_product:
        type: string
      domain:
        type: string
      owner:
        type: string
      description:
        type: string
      tags:
        type: array
        items:
          type: string
  entity_state:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
  source_fragment:
    type: object
    additionalProperties: false
    dependentRequired:
      resource:
      - ref
    properties:
      ref:
        type: string
      resource:
        type: string
      format:
        type: string
        enum:
        - csv
        - tsv
        - fixed
        - parquet
        - json
        - xlsx
        - orc
        - avro
        - xml
      path:
        type: string
      storage:
        type: string
      options:
        $ref: '#/$defs/source_options'
      cast_mode:
        type: string
        enum:
        - strict
        - coerce
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  source_options:
    type: object
    additionalProperties: false
    properties:
      header:
        type: boolean
      separator:
        type: string
      encoding:
        type: string
      null_values:
        type: array
        items:
          type: string
      recursive:
        type: boolean
      glob:
        type: string
      json_mode:
        type: string
        enum:
        - array
        - ndjson
      sheet:
        type: string
      header_row:
        type: integer
        minimum: 1
      data_row:
        type: integer
        minimum: 1
      row_tag:
        type: string
      namespace:
        type: string
      value_tag:
        type: string
  sink_fragment:
    type: object
    additionalProperties: false
    properties:
      write_mode:
        type: string
        enum:
        - overwrite
        - append
        - merge_scd1
        - merge_scd2
      accepted:
        $ref: '#/$defs/sink_accepted_fragment'
      rejected:
        $ref: '#/$defs/sink_rejected_fragment'
      archive:
        $ref: '#/$defs/archive_target'
  sink_accepted_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum:
        - parquet
        - delta
        - iceberg
        - duckdb
      path:
        type: string
      storage:
        type: string
      options:
        type: object
        additionalProperties: false
        properties:
          compression:
            type: string
            enum:
            - snappy
            - gzip
            - zstd
            - uncompressed
          row_group_size:
            type: integer
            minimum: 1
          max_size_per_file:
            type: integer
            minimum: 1
      filesystem:
        type: string
      merge:
        $ref: '#/$defs/merge'
      iceberg:
        $ref: '#/$defs/iceberg'
      delta:
        $ref: '#/$defs/delta'
      duckdb:
        $ref: '#/$defs/duckdb'
      partition_by:
        type: array
        items:
          type: string
        minItems: 1
      partition_spec:
        type: array
        items:
          $ref: '#/$defs/partition_field'
        minItems: 1
    allOf:
    - not:
        required:
        - storage
        - filesystem
  merge:
    type: object
    additionalProperties: false
    properties:
      ignore_columns:
        type: array
        items:
          type: string
      compare_columns:
        type: array
        items:
          type: string
      scd2:
        $ref: '#/$defs/merge_scd2'
  merge_scd2:
    type: object
    additionalProperties: false
    properties:
      current_flag_column:
        type: string
      valid_from_column:
        type: string
      valid_to_column:
        type: string
  iceberg:
    type: object
    additionalProperties: false
    properties:
      catalog:
        type: string
      namespace:
        type: string
      table:
        type: string
      location:
        type: string
  delta:
    type: object
    additionalProperties: false
    properties:
      catalog:
        type: string
      schema:
        type: string
      table:
        type: string
  duckdb:
    type: object
    additionalProperties: false
    properties:
      table:
        type: string
        pattern: \S
      schema:
        type: string
      connection:
        type: string
        anyOf:
        - pattern: '^\s*md:'
        - pattern: ^\s*$
      token:
        type: string
  partition_field:
    type: object
    additionalProperties: false
    properties:
      column:
        type: string
      transform:
        type: string
        enum:
        - identity
        - year
        - month
        - day
        - hour
    required:
    - column
  sink_rejected_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum:
        - csv
      path:
        type: string
      storage:
        type: string
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  archive_target:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
      storage:
        type: string
  policy_fragment:
    type: object
    additionalProperties: false
    properties:
      severity:
        type: string
        enum:
        - warn
        - reject
        - abort
  schema:
    type: object
    additionalProperties: false
    required:
    - columns
    properties:
      normalize_columns:
        $ref: '#/$defs/normalize_columns'
      mismatch:
        $ref: '#/$defs/schema_mismatch'
      schema_evolution:
        $ref: '#/$defs/schema_evolution'
      primary_key:
        type: array
        minItems: 1
        items:
          type: string
      unique_keys:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            type: string
      columns:
        type: array
        items:
          $ref: '#/$defs/column'
  normalize_columns:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      strategy:
        type: string
        enum:
        - snake_case
        - lower
        - camel_case
        - none
  schema_mismatch:
    type: object
    additionalProperties: false
    properties:
      missing_columns:
        type: string
        enum:
        - reject_file
        - fill_nulls
      extra_columns:
        type: string
        enum:
        - reject_file
        - ignore
  schema_evolution:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum:
        - strict
        - add_columns
      on_incompatible:
        type: string
        enum:
        - fail
  column:
    type: object
    additionalProperties: false
    required:
    - name
    - type
    properties:
      name:
        type: string
      source:
        type: string
      type:
        type: string
        enum:
        - string
        - str
        - text
        - boolean
        - bool
        - int8
        - int16
        - int32
        - int64
        - int
        - integer
        - long
        - uint8
        - uint16
        - uint32
        - uint64
        - float32
        - float64
        - float
        - double
        - number
        - decimal
        - date
        - datetime
        - timestamp
        - time
      nullable:
        type: boolean
      unique:
        type: boolean
      width:
        type: integer
        minimum: 1
      trim:
        type: boolean
  pii_fragment:
    type: object
    additionalProperties: false
    properties:
      columns:
        type: array
        items:
          $ref: '#/$defs/pii_column'
  pii_column:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      mask_pattern:
        type: string
      redact_value:
        type: string
      key:
        type: string
      strategy:
        type: string
        enum:
        - hash
        - drop
        - nullify
        - redact
        - mask
    required:
    - name
    - strategy
    allOf:
    - if:
        properties:
          strategy:
            const: mask
      then:
        required:
        - mask_pattern
  source:
    type: object
    additionalProperties: false
    allOf:
    - if:
        required:
        - ref
      then:
        properties:
          ref:
            type: string
      else:
        not:
          required:
          - resource
    - not:
        required:
        - storage
        - filesystem
    anyOf:
    - required:
      - format
      - path
    - required:
      - ref
    properties:
      ref:
        type: string
      resource:
        type: string
      format:
        type: string
        enum:
        - csv
        - tsv
        - fixed
        - parquet
        - json
        - xlsx
        - orc
        - avro
        - xml
      path:
        type: string
      storage:
        type: string
      options:
        $ref: '#/$defs/source_options'
      cast_mode:
        type: string
        enum:
        - strict
        - coerce
      filesystem:
        type: string
  sink:
    type: object
    additionalProperties: false
    required:
    - accepted
    properties:
      write_mode:
        type: string
        enum:
        - overwrite
        - append
        - merge_scd1
        - merge_scd2
      accepted:
        $ref: '#/$defs/sink_accepted'
      rejected:
        $ref: '#/$defs/sink_rejected'
      archive:
        $ref: '#/$defs/archive_target'
    allOf:
    - if:
        required:
        - accepted
        properties:
          accepted:
            required:
            - merge
      then:
        required:
        - write_mode
        properties:
          write_mode:
            enum:
            - merge_scd1
            - merge_scd2
    - if:
        required:
        - accepted
        properties:
          accepted:
            required:
            - merge
            properties:
              merge:
                required:
                - scd2
      then:
        properties:
          write_mode:
            const: merge_scd2
    - if:
        required:
        - accepted
        properties:
          accepted:
            properties:
              format:
                enum:
                - parquet
                - iceberg
      then:
        properties:
          write_mode:
            enum:
            - overwrite
            - append
  sink_accepted:
    allOf:
    - $ref: '#/$defs/sink_accepted_fragment'
    - required:
      - format
    - anyOf:
      - required:
        - path
      - required:
        - duckdb
        properties:
          format:
            const: duckdb
          duckdb:
            required:
            - connection
            - table
            properties:
              connection:
                pattern: '^\s*md:'
    - if:
        required:
        - duckdb
      then:
        properties:
          format:
            const: duckdb
          duckdb:
            required:
            - table
    - if:
        required:
        - format
        properties:
          format:
            const: duckdb
      then:
        required:
        - duckdb
        properties:
          duckdb:
            required:
            - table
    - if:
        required:
        - iceberg
        properties: {}
      then:
        properties:
          format:
            const: iceberg
    - if:
        required:
        - delta
        properties: {}
      then:
        properties:
          format:
            const: delta
    - not:
        required:
        - partition_by
        - partition_spec
    - if:
        required:
        - partition_spec
        properties: {}
      then:
        properties:
          format:
            const: iceberg
  sink_rejected:
    allOf:
    - $ref: '#/$defs/sink_rejected_fragment'
    - required:
      - format
      - path
  policy:
    allOf:
    - $ref: '#/$defs/policy_fragment'
    - required:
      - severity
  pii:
    type: object
    additionalProperties: false
    properties:
      columns:
        type: array
        items:
          $ref: '#/$defs/pii_column'
    required:
    - columns
  entity_reject:
    type: object
    properties:
      policy:
        type: object
        properties:
          severity:
            const: reject
      sink:
        type: object
        required:
        - rejected
  entity_non_reject:
    type: object
    properties:
      policy:
        type: object
        properties:
          severity:
            enum:
            - warn
            - abort
  local_evolution_sink:
    if:
      required:
      - schema
      - sink
      properties:
        schema:
          required:
          - schema_evolution
          properties:
            schema_evolution:
              required:
              - mode
              properties:
                mode:
                  const: add_columns
        sink:
          required:
          - accepted
          properties:
            accepted:
              required:
              - format
    then:
      properties:
        sink:
          properties:
            accepted:
              properties:
                format:
                  const: delta
  domain_legacy:
    type: object
    additionalProperties: false
    required:
    - name
    - incoming_dir
    properties:
      name:
        type: string
      incoming_dir:
        type: string
  inline_entity:
    allOf:
    - $ref: '#/$defs/entity_fragment'
    - anyOf:
      - required:
        - domain
      - $ref: '#/$defs/entity'
    - $ref: '#/$defs/local_evolution_sink'
  entity_fragment:
    allOf:
    - $ref: '#/$defs/entity_base'
    - required:
      - name
      - schema
    - $ref: '#/$defs/local_evolution_sink'
  project_metadata:
    type: object
    additionalProperties: false
    properties:
      project:
        type: string
      description:
        type: string
      owner:
        type: string
      tags:
        type: array
        items:
          type: string
  storages:
    type: object
    additionalProperties: false
    required:
    - default
    - definitions
    properties:
      default:
        type: string
      definitions:
        type: array
        items:
          $ref: '#/$defs/storage_definition'
        minItems: 1
  storage_definition:
    type: object
    additionalProperties: false
    required:
    - name
    - type
    properties:
      name:
        type: string
      type:
        type: string
        enum:
        - local
        - s3
        - adls
        - gcs
      bucket:
        type: string
      region:
        type: string
      account:
        type: string
      container:
        type: string
      prefix:
        type: string
      endpoint:
        type: string
      path_style_access:
        type: boolean
    allOf:
    - if:
        required:
        - type
        properties:
          type:
            const: s3
      then:
        required:
        - bucket
        - region
    - if:
        required:
        - type
        properties:
          type:
            const: adls
      then:
        required:
        - account
        - container
    - if:
        required:
        - type
        properties:
          type:
            const: gcs
      then:
        required:
        - bucket
  env:
    type: object
    additionalProperties: false
    properties:
      file:
        type: string
      vars:
        type: object
        additionalProperties:
          type: string
  domains:
    type: array
    items:
      $ref: '#/$defs/domain'
  domain:
    type: object
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
      incoming_dir:
        type: string
      defaults:
        $ref: '#/$defs/entity_defaults'
  entity_defaults:
    type: object
    additionalProperties: false
    properties:
      metadata:
        $ref: '#/$defs/entity_metadata'
      domain:
        type: string
      incremental_mode:
        type: string
        enum:
        - none
        - archive
        - file
        - row
      state:
        $ref: '#/$defs/entity_state'
      source:
        allOf:
        - $ref: '#/$defs/source_fragment'
        - not:
            anyOf:
            - required:
              - ref
            - required:
              - resource
      sink:
        $ref: '#/$defs/sink_fragment'
      policy:
        $ref: '#/$defs/policy_fragment'
      schema:
        $ref: '#/$defs/schema_defaults'
      pii:
        $ref: '#/$defs/pii_fragment'
  schema_defaults:
    type: object
    additionalProperties: false
    properties:
      normalize_columns:
        $ref: '#/$defs/normalize_columns'
      mismatch:
        $ref: '#/$defs/schema_mismatch'
      schema_evolution:
        $ref: '#/$defs/schema_evolution'
      unique_keys:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            type: string
  source_definitions:
    type: array
    items:
      $ref: '#/$defs/source_definition'
  source_definition:
    type: object
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
      format:
        type: string
        enum:
        - csv
        - tsv
        - fixed
        - parquet
        - json
        - xlsx
        - orc
        - avro
        - xml
      path:
        type: string
      storage:
        type: string
      options:
        $ref: '#/$defs/source_options'
      cast_mode:
        type: string
        enum:
        - strict
        - coerce
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  include:
    type: object
    additionalProperties: false
    anyOf:
    - required:
      - domains
    - required:
      - sources
    properties:
      domains:
        type: array
        minItems: 1
        items:
          type: string
      sources:
        type: string
  report:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
      formatter:
        type: string
        enum:
        - json
        - csv
        - text
      storage:
        type: string
  catalogs:
    type: object
    additionalProperties: false
    required:
    - definitions
    properties:
      default:
        type: string
        description: Default catalog name used when entity sinks omit a catalog.
      definitions:
        type: array
        items:
          $ref: '#/$defs/catalog_definition'
        minItems: 1
  catalog_definition:
    type: object
    additionalProperties: false
    required:
    - name
    - type
    properties:
      name:
        type: string
        minLength: 1
      type:
        type: string
        enum:
        - glue
        - rest
        - unity
      warehouse_storage:
        type: string
        description: Optional storage definition name used as the catalog warehouse root.
      warehouse_prefix:
        type: string
        description: Optional path prefix under the warehouse storage.
      region:
        type: string
        description: Glue catalog region; required when type is glue.
      database:
        type: string
        description: Glue database; required when type is glue.
      create_database_if_missing:
        type: boolean
      allow_takeover:
        type: boolean
      uri:
        type: string
        description: REST catalog URI; required when type is rest.
      credential:
        type: string
      warehouse:
        type: string
      oauth2_server_uri:
        type: string
      scope:
        type: string
      host:
        type: string
        description: Unity Catalog host; required when type is unity.
      catalog:
        type: string
        description: Unity Catalog name; required when type is unity.
      schema:
        type: string
        description: Unity schema name; required when type is unity.
      token:
        type: string
        description: Unity authentication token or substituted secret.
      create_schema_if_missing:
        type: boolean
