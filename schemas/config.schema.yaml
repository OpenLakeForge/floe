$schema: https://yaml-schema.net/yaml-config.schema.yaml
$id: https://floe.local/schema/config-v0.3

title: Floe Config v0.3

type: object
additionalProperties: false
required:
  - version
allOf:
  - if:
      properties:
        version:
          pattern: '^\+?0+\.\+?0*[12]$'
    then:
      required: [entities]
      properties:
        entities:
          type: array
          items:
            allOf:
              - $ref: "#/$defs/entity"
              - properties:
                  source:
                    not:
                      anyOf:
                        - required: [ref]
                        - required: [resource]
        domains:
          type: array
          items:
            $ref: "#/$defs/domain_legacy"
      not:
        anyOf:
          - required: [sources]
          - required: [include]
  - if:
      properties:
        version:
          type: string
      not:
        properties:
          version:
            pattern: '^\+?0+\.\+?0*[12]$'
    then:
      properties:
        entities:
          type: array
          items:
            $ref: "#/$defs/entity_fragment"
      anyOf:
        - required: [entities]
        - required: [include]
          properties:
            include:
              required: [domains]
              properties:
                domains:
                  minItems: 1
      not:
        required: [sources, include]
        properties:
          include:
            required: [sources]

properties:
  version:
    type: string
    pattern: '^\+?[0-9]+\.\+?[0-9]+$'
    not:
      pattern: '^\+?0+\.\+?0+$'
  metadata:
    $ref: "#/$defs/project_metadata"
  storages:
    $ref: "#/$defs/storages"
  env:
    $ref: "#/$defs/env"
  domains:
    $ref: "#/$defs/domains"
  sources:
    $ref: "#/$defs/source_definitions"
  include:
    $ref: "#/$defs/include"
  report:
    $ref: "#/$defs/report"
  entities:
    type: array
    items:
      $ref: "#/$defs/entity_fragment"

$defs:
  project_metadata:
    type: object
    additionalProperties: false
    properties:
      project:
        type: string
      description:
        type: string
      owner:
        type: string
      tags:
        type: array
        items:
          type: string

  entity_base:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
      metadata:
        $ref: "#/$defs/entity_metadata"
      domain:
        type: string
      incremental_mode:
        type: string
        enum: [none, archive, file, row]
      state:
        $ref: "#/$defs/entity_state"
      source:
        $ref: "#/$defs/source_fragment"
      sink:
        $ref: "#/$defs/sink_fragment"
      policy:
        $ref: "#/$defs/policy_fragment"
      schema:
        $ref: "#/$defs/schema"

  entity_fragment:
    allOf:
      - $ref: "#/$defs/entity_base"
      - required: [name, schema]

  entity:
    allOf:
      - $ref: "#/$defs/entity_base"
      - required: [name, source, sink, policy, schema]
      - properties:
          source:
            $ref: "#/$defs/source"
          sink:
            $ref: "#/$defs/sink"
          policy:
            $ref: "#/$defs/policy"
      - oneOf:
          - $ref: "#/$defs/entity_reject"
          - $ref: "#/$defs/entity_non_reject"

  entity_reject:
    type: object
    properties:
      policy:
        type: object
        properties:
          severity:
            const: reject
      sink:
        type: object
        required:
          - rejected

  entity_non_reject:
    type: object
    properties:
      policy:
        type: object
        properties:
          severity:
            enum: [warn, abort]

  entity_metadata:
    type: object
    additionalProperties: false
    properties:
      data_product:
        type: string
      domain:
        type: string
      owner:
        type: string
      description:
        type: string
      tags:
        type: array
        items:
          type: string

  entity_state:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string

  env:
    type: object
    additionalProperties: false
    properties:
      file:
        type: string
      vars:
        type: object
        additionalProperties:
          type: string

  domains:
    type: array
    items:
      $ref: "#/$defs/domain"

  domain:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
      incoming_dir:
        type: string
      defaults:
        $ref: "#/$defs/entity_defaults"

  domain_legacy:
    type: object
    additionalProperties: false
    required: [name, incoming_dir]
    properties:
      name:
        type: string
      incoming_dir:
        type: string

  source_definitions:
    type: array
    items:
      $ref: "#/$defs/source_definition"

  source_definition:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
      format:
        type: string
        enum: [csv, tsv, fixed, parquet, json, xlsx, orc, avro, xml]
      path:
        type: string
      storage:
        type: string
      options:
        $ref: "#/$defs/source_options"
      cast_mode:
        type: string
        enum: [strict, coerce]

  include:
    type: object
    additionalProperties: false
    anyOf:
      - required: [domains]
      - required: [sources]
    properties:
      domains:
        type: array
        minItems: 1
        items:
          type: string
      sources:
        type: string

  sources_file:
    type: object
    additionalProperties: false
    required: [sources]
    properties:
      sources:
        $ref: "#/$defs/source_definitions"

  domain_file:
    $ref: "#/$defs/domain"

  entity_file:
    $ref: "#/$defs/entity_fragment"

  entity_defaults:
    type: object
    additionalProperties: false
    properties:
      metadata:
        $ref: "#/$defs/entity_metadata"
      domain:
        type: string
      incremental_mode:
        type: string
        enum: [none, archive, file, row]
      state:
        $ref: "#/$defs/entity_state"
      source:
        allOf:
          - $ref: "#/$defs/source_fragment"
          - not:
              anyOf:
                - required: [ref]
                - required: [resource]
      sink:
        $ref: "#/$defs/sink_fragment"
      policy:
        $ref: "#/$defs/policy_fragment"
      schema:
        $ref: "#/$defs/schema_defaults"

  schema_defaults:
    type: object
    additionalProperties: false
    properties:
      normalize_columns:
        $ref: "#/$defs/normalize_columns"
      mismatch:
        $ref: "#/$defs/schema_mismatch"
      schema_evolution:
        $ref: "#/$defs/schema_evolution"
      unique_keys:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            type: string

  source_fragment:
    type: object
    additionalProperties: false
    dependentRequired:
      resource: [ref]
    properties:
      ref:
        type: string
      resource:
        type: string
      format:
        type: string
        enum: [csv, tsv, fixed, parquet, json, xlsx, orc, avro, xml]
      path:
        type: string
      storage:
        type: string
      options:
        $ref: "#/$defs/source_options"
      cast_mode:
        type: string
        enum: [strict, coerce]

  source:
    type: object
    additionalProperties: false
    allOf:
      - if:
          required: [ref]
        then:
          properties:
            ref:
              type: string
        else:
          not:
            required: [resource]
    anyOf:
      - required: [format, path]
      - required: [ref]
    properties:
      ref:
        type: string
      resource:
        type: string
      format:
        type: string
        enum: [csv, tsv, fixed, parquet, json, xlsx, orc, avro, xml]
      path:
        type: string
      storage:
        type: string
      options:
        $ref: "#/$defs/source_options"
      cast_mode:
        type: string
        enum: [strict, coerce]

  source_options:
    type: object
    additionalProperties: false
    properties:
      header:
        type: boolean
      separator:
        type: string
      encoding:
        type: string
      null_values:
        type: array
        items:
          type: string
      recursive:
        type: boolean
      glob:
        type: string
      json_mode:
        type: string
        enum: ["array", "ndjson"]
      sheet:
        type: string
      header_row:
        type: integer
        minimum: 1
      data_row:
        type: integer
        minimum: 1
      row_tag:
        type: string
      namespace:
        type: string
      value_tag:
        type: string

  sink:
    type: object
    additionalProperties: false
    required:
      - accepted
    properties:
      write_mode:
        type: string
        enum: [overwrite, append, merge_scd1, merge_scd2]
      accepted:
        $ref: "#/$defs/sink_accepted"
      rejected:
        $ref: "#/$defs/sink_rejected"
      archive:
        $ref: "#/$defs/archive_target"

  sink_fragment:
    type: object
    additionalProperties: false
    properties:
      write_mode:
        type: string
        enum: [overwrite, append, merge_scd1, merge_scd2]
      accepted:
        $ref: "#/$defs/sink_accepted_fragment"
      rejected:
        $ref: "#/$defs/sink_rejected_fragment"
      archive:
        $ref: "#/$defs/archive_target"

  sink_accepted:
    allOf:
      - $ref: "#/$defs/sink_accepted_fragment"
      - required: [format, path]

  sink_accepted_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum: [parquet, delta]
      path:
        type: string
      storage:
        type: string
      options:
        type: object
        additionalProperties: false
        properties:
          compression:
            type: string
            enum: [snappy, gzip, zstd, uncompressed]
          row_group_size:
            type: integer
            minimum: 1
          max_size_per_file:
            type: integer
            minimum: 1

  sink_rejected:
    allOf:
      - $ref: "#/$defs/sink_rejected_fragment"
      - required: [format, path]

  sink_rejected_fragment:
    type: object
    additionalProperties: false
    properties:
      format:
        type: string
        enum: [csv]
      path:
        type: string
      storage:
        type: string

  report:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
      formatter:
        type: string
        enum: [json, csv, text]
      storage:
        type: string

  storages:
    type: object
    additionalProperties: false
    required:
      - default
      - definitions
    properties:
      default:
        type: string
      definitions:
        type: array
        items:
          $ref: "#/$defs/storage_definition"

  storage_definition:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
      type:
        type: string
        enum: [local, s3, adls, gcs]
      bucket:
        type: string
      region:
        type: string
      account:
        type: string
      container:
        type: string
      prefix:
        type: string

  archive_target:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
      storage:
        type: string

  policy:
    allOf:
      - $ref: "#/$defs/policy_fragment"
      - required: [severity]

  policy_fragment:
    type: object
    additionalProperties: false
    properties:
      severity:
        type: string
        enum: [warn, reject, abort]

  schema:
    type: object
    additionalProperties: false
    required:
      - columns
    properties:
      normalize_columns:
        $ref: "#/$defs/normalize_columns"
      mismatch:
        $ref: "#/$defs/schema_mismatch"
      schema_evolution:
        $ref: "#/$defs/schema_evolution"
      primary_key:
        type: array
        minItems: 1
        items:
          type: string
      unique_keys:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            type: string
      columns:
        type: array
        items:
          $ref: "#/$defs/column"

  schema_evolution:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [strict, add_columns]
      on_incompatible:
        type: string
        enum: [fail]

  normalize_columns:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      strategy:
        type: string
        enum: [snake_case, lower, camel_case, none]

  schema_mismatch:
    type: object
    additionalProperties: false
    properties:
      missing_columns:
        type: string
        enum: [reject_file, fill_nulls]
      extra_columns:
        type: string
        enum: [reject_file, ignore]

  column:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
      source:
        type: string
      type:
        type: string
        enum: [string, integer, number, float, decimal, boolean, date, datetime]
      nullable:
        type: boolean
      unique:
        type: boolean
      width:
        type: integer
        minimum: 1
      trim:
        type: boolean
