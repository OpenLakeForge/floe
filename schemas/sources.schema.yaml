$schema: https://json-schema.org/draft/2020-12/schema
$id: https://floe.local/schema/sources.schema.yaml
type: object
additionalProperties: false
required:
- sources
properties:
  sources:
    $ref: '#/$defs/source_definitions'
title: Floe sources document
$defs:
  source_definitions:
    type: array
    items:
      $ref: '#/$defs/source_definition'
  source_definition:
    type: object
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
      format:
        type: string
        enum:
        - csv
        - tsv
        - fixed
        - parquet
        - json
        - xlsx
        - orc
        - avro
        - xml
      path:
        type: string
      storage:
        type: string
      options:
        $ref: '#/$defs/source_options'
      cast_mode:
        type: string
        enum:
        - strict
        - coerce
      filesystem:
        type: string
    allOf:
    - not:
        required:
        - storage
        - filesystem
  source_options:
    type: object
    additionalProperties: false
    properties:
      header:
        type: boolean
      separator:
        type: string
      encoding:
        type: string
      null_values:
        type: array
        items:
          type: string
      recursive:
        type: boolean
      glob:
        type: string
      json_mode:
        type: string
        enum:
        - array
        - ndjson
      sheet:
        type: string
      header_row:
        type: integer
        minimum: 1
      data_row:
        type: integer
        minimum: 1
      row_tag:
        type: string
      namespace:
        type: string
      value_tag:
        type: string
