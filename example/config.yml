version: "0.8"

metadata:
  project: "floe"
  description: "Example multi-entity technical ingestion config"
  owner: "data-platform"
  tags: ["v0.1", "examples"]

report:
  path: "./report"

entities:
  - name: "customer"
    incremental_mode: "file"
    state:
      path: "./state/customer.json"

    metadata:
      data_product: "customer_master"
      domain: "sales"
      owner: "data-platform"
      description: "Technical ingestion contract for customer dataset"
      tags: ["prepared", "masterdata"]

    source:
      format: "csv"
      path: "./in/customer"
      options:
        header: true
        separator: ","
        encoding: "utf-8"
        null_values: ["", "NULL", "null"]
        glob: "*.csv"
      cast_mode: "strict"   # strict | coerce

    sink:
      accepted:
        format: "parquet"
        path: "./out/accepted/customer/"
      rejected:
        format: "csv"
        path: "./out/rejected/customer/"


    policy:
      severity: "reject"   # warn | reject | abort

    schema:
      mismatch:
        missing_columns: "reject_file"
        extra_columns: "ignore"
      normalize_columns:
        enabled: true
        strategy: "snake_case"     # snake_case | lower | none

      unique_keys: [["customer_id"], ["email"]]
      columns:
        - name: "customer_id"
          type: "string"
          nullable: false

        - name: "email"
          type: "string"
          nullable: true

        - name: "country_code"
          type: "string"
          nullable: true

        - name: "created_at"
          type: "datetime"
          nullable: true

  - name: "orders"

    metadata:
      data_product: "order_events"
      domain: "sales"
      owner: "data-platform"
      description: "Technical ingestion contract for order events"
      tags: ["prepared", "events"]

    source:
      format: "json"
      path: "./in/orders"
      options:
        json_mode: "array"
      cast_mode: "strict"   # strict | coerce

    sink:
      accepted:
        format: "parquet"
        path: "./out/accepted/orders/"
      rejected:
        format: "csv"
        path: "./out/rejected/orders/"

    policy:
      severity: "warn"   # warn | reject | abort

    schema:
      mismatch:
        missing_columns: "fill_nulls"
        extra_columns: "ignore"
      normalize_columns:
        enabled: true
        strategy: "snake_case"     # snake_case | lower | none

      unique_keys: [["order_id"]]
      columns:
        - name: "order_id"
          source: "order.id"
          type: "string"
          nullable: false

        - name: "customer_id"
          source: "customer.id"
          type: "string"
          nullable: false

        - name: "order_total"
          source: "totals.amount"
          type: "number"
          nullable: false

        - name: "currency"
          source: "totals.currency"
          type: "string"
          nullable: true

        - name: "created_at"
          source: "timestamps.created_at"
          type: "datetime"
          nullable: true

        - name: "order_date"
          source: "timestamps.order_date"
          type: "date"
          nullable: true

        - name: "is_expedited"
          source: "shipping.expedited"
          type: "boolean"
          nullable: true

        - name: "first_item_sku"
          source: "items[0].sku"
          type: "string"
          nullable: true

        - name: "first_item_qty"
          source: "items[0].quantity"
          type: "number"
          nullable: true

        - name: "first_tag"
          source: "tags[0]"
          type: "string"
          nullable: true
