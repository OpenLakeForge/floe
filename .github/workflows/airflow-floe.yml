name: Airflow Floe (Python)

on:
  pull_request:
    paths:
      - "orchestrators/airflow-floe/**"
      - "orchestrators/dagster-floe/src/floe_dagster/databricks_client.py"
      - "orchestrators/dagster-floe/src/floe_dagster/k8s_status.py"
      - ".github/workflows/airflow-floe.yml"
  push:
    branches: ["main"]
    paths:
      - "orchestrators/airflow-floe/**"
      - "orchestrators/dagster-floe/src/floe_dagster/databricks_client.py"
      - "orchestrators/dagster-floe/src/floe_dagster/k8s_status.py"
      - ".github/workflows/airflow-floe.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (airflow ${{ matrix.airflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ponytail: exact patch versions, because Airflow's constraints files are tagged per
        # release; bump when a new 3.1.x / 3.4.x patch ships.
        airflow: ["3.1.8", "3.4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall orchestrators/airflow-floe/src orchestrators/airflow-floe/dags orchestrators/airflow-floe/tests
      - name: Install real Airflow with its constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install orchestrators/airflow-floe "apache-airflow==${{ matrix.airflow }}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-3.12.txt"
      - name: Tests
        run: python -m unittest discover -s orchestrators/airflow-floe/tests -p "test_*.py"
