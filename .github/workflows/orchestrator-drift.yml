name: Orchestrator Drift Guard

on:
  pull_request:
    paths:
      - "orchestrators/dagster-floe/src/floe_dagster/databricks_client.py"
      - "orchestrators/airflow-floe/src/airflow_floe/databricks_client.py"
      - "orchestrators/dagster-floe/src/floe_dagster/k8s_status.py"
      - "orchestrators/airflow-floe/src/airflow_floe/k8s_status.py"
      - "orchestrators/schemas/floe.manifest.v1.json"
      - "orchestrators/dagster-floe/src/floe_dagster/schemas/floe.manifest.v1.json"
      - "scripts/check_orchestrator_drift.py"
      - ".github/workflows/orchestrator-drift.yml"
  push:
    branches: ["main"]
    paths:
      - "orchestrators/dagster-floe/src/floe_dagster/databricks_client.py"
      - "orchestrators/airflow-floe/src/airflow_floe/databricks_client.py"
      - "orchestrators/dagster-floe/src/floe_dagster/k8s_status.py"
      - "orchestrators/airflow-floe/src/airflow_floe/k8s_status.py"
      - "orchestrators/schemas/floe.manifest.v1.json"
      - "orchestrators/dagster-floe/src/floe_dagster/schemas/floe.manifest.v1.json"
      - "scripts/check_orchestrator_drift.py"
      - ".github/workflows/orchestrator-drift.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check shared orchestrator modules are in sync
        run: python scripts/check_orchestrator_drift.py
