name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single source of truth for path-based change detection. Runs `paths-filter`
  # once and exposes every flag as a job output so the jobs below can gate at the
  # job level (via `needs` + `if`) instead of each re-running checkout +
  # paths-filter and booting a runner only to skip its steps.
  changes:
    runs-on: ubuntu-latest
    outputs:
      config_schema: ${{ steps.filter.outputs.config_schema }}
      docs: ${{ steps.filter.outputs.docs }}
      python_core: ${{ steps.filter.outputs.python_core }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            config_schema:
              - "schemas/**"
              - "scripts/test_config_schema.py"
              - "src/floe/config/**"
              - "src/floe/pii.py"
              - "pyproject.toml"
              - "uv.lock"
              - "example/project/**"
              - "example/standalone/**"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - "README.md"
            python_core:
              - "src/floe/**"
              - "tests/**"
              - "conformance/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"
            conformance:
              - "conformance/**"
              - "src/floe/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"

  config-schema:
    needs: changes
    if: needs.changes.outputs.config_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run python scripts/test_config_schema.py

  python-lint:
    needs: changes
    if: needs.changes.outputs.python_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check

  python-types:
    needs: changes
    if: needs.changes.outputs.python_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run pyright

  python-test:
    needs: changes
    # Gated per step, not per job: a skipped matrix job reports one `python-test`
    # check, so the required `python-test (<version>)` checks would never report.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a stalled download or source build fails fast instead of hanging for GitHub's 6 h default
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (`requires-python`) and the newest with a wheel for every locked
        # package. 3.15 builds duckdb, numpy, pyiceberg, pyyaml and zstandard from source;
        # move up once they ship cp315 wheels.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.python_core == 'true'
      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.python_core == 'true'
      - run: uv sync --all-groups --python ${{ matrix.python-version }}
        if: needs.changes.outputs.python_core == 'true'
      - run: uv run --python ${{ matrix.python-version }} pytest
        if: needs.changes.outputs.python_core == 'true'

  golden:
    # The branch ruleset requires the check named `conformance`.
    name: conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - name: Python matches every golden case
        run: uv run python conformance/check.py

