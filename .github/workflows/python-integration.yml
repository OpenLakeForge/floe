name: Python integration (Polaris)

# Also nightly: the `glue` tests against moto, the `perf` memory test (#1063) and the 200-entity `scale` suite (#558),
# whose 10-entity Iceberg subset runs in the `polaris` job below.
# Runs the `polaris` and `s3` marked tests against the #602 harness (Polaris + SeaweedFS), and the `adls` marked
# tests against Azurite and the `gcs` marked tests against fake-gcs-server in the `object-stores` job.
# Merge gate (#1456): the `integration-gate` job runs on every PR and merge-queue entry and is the one check to mark
# required. Path selection is inside the workflow (`changes`), so a docs-only PR gets a green gate without service
# containers and a required check never deadlocks. Selected jobs must pass and must actually run tests.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests and the merge queue run only what their paths select; nightly and manual runs select everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      polaris: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.polaris == 'true' }}
      object_stores: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.object_stores == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          filters: |
            polaris:
              - "src/floe/iceberg/**"
              - "src/floe/delta/**"
              - "src/floe/storage/**"
              - "src/floe/run/**"
              - "src/floe/checks/**"
              - "tests/integration/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/python-integration.yml"
              - "scripts/assert_tests_ran.py"
            object_stores:
              - "src/floe/iceberg/**"
              - "src/floe/storage/**"
              - "tests/integration/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/python-integration.yml"
              - "scripts/assert_tests_ran.py"

  polaris:
    needs: changes
    if: needs.changes.outputs.polaris == 'true'
    runs-on: ubuntu-latest
    env:
      FLOE_POLARIS_URI: http://localhost:8181/api/catalog
      FLOE_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      # Same images, credentials and settings as spikes/python/harness/docker-compose.yml (#602).
      - name: Start SeaweedFS and Polaris
        run: |
          docker network create harness
          docker run -d --name seaweedfs --network harness -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=spike -e AWS_SECRET_ACCESS_KEY=spike-s3-secret \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -bucket=warehouse
          # 403 without credentials means S3 is up and auth is on.
          timeout 120 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" localhost:8333/warehouse)" = 403 ]; do sleep 2; done'
          docker run -d --name polaris --network harness -p 8181:8181 -p 8182:8182 \
            -e AWS_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=spike -e AWS_SECRET_ACCESS_KEY=spike-s3-secret \
            -e POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,s3cr3t \
            -e polaris.realm-context.realms=POLARIS -e quarkus.otel.sdk.disabled=true \
            apache/polaris:1.8.0@sha256:347615e736cab2c9be0d8c464552ac930be4755302bb0aeb745216bbae99ba5b
          timeout 180 sh -c 'until curl -sf localhost:8182/q/health; do sleep 2; done'
      # Same steps as spikes/python/harness/bootstrap.py (#602), on a fresh in-memory Polaris.
      - name: Bootstrap catalog, principal and grants
        run: |
          token() {
            curl -sS --fail-with-body localhost:8181/api/catalog/v1/oauth/tokens \
              -d grant_type=client_credentials -d client_id="$1" -d client_secret="$2" \
              -d scope=PRINCIPAL_ROLE:ALL | jq -r .access_token
          }
          api() {
            curl -sS --fail-with-body -X "$1" "localhost:8181/api$2" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$3"
            echo
          }
          TOKEN=$(token root s3cr3t)
          api POST /management/v1/catalogs '{"catalog": {"name": "spike", "type": "INTERNAL",
            "properties": {"default-base-location": "s3://warehouse/spike"},
            "storageConfigInfo": {"storageType": "S3", "allowedLocations": ["s3://warehouse"],
              "endpoint": "http://localhost:8333", "endpointInternal": "http://seaweedfs:8333",
              "pathStyleAccess": true, "region": "us-east-1", "stsUnavailable": true}}}'
          api POST /management/v1/principals '{"principal": {"name": "spike"}}'
          api POST /management/v1/principals/spike/reset '{"clientId": "spike-client", "clientSecret": "spike-secret"}'
          api POST /management/v1/principal-roles '{"principalRole": {"name": "spike_role"}}'
          api PUT /management/v1/principals/spike/principal-roles '{"principalRole": {"name": "spike_role"}}'
          api PUT /management/v1/principal-roles/spike_role/catalog-roles/spike '{"catalogRole": {"name": "catalog_admin"}}'
          api PUT /management/v1/catalogs/spike/catalog-roles/catalog_admin/grants '{"grant": {"type": "catalog", "privilege": "CATALOG_MANAGE_CONTENT"}}'
          # As the new principal: checks its credentials and grants.
          TOKEN=$(token spike-client spike-secret)
          api POST /catalog/v1/spike/namespaces '{"namespace": ["spike"]}'
      - run: uv run pytest -m "polaris or s3" -rs --junitxml=junit.xml tests/integration
      - run: uv run python scripts/assert_tests_ran.py junit.xml
      - name: Scale subset on Polaris
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest -m "polaris and scale" -rs tests/scale
      - name: Container logs
        if: failure()
        run: |
          docker logs seaweedfs
          docker logs polaris

  # ADLS on Azurite (#1327) and GCS on fake-gcs-server behind the test's XML upload shim (#1342).
  # Azurite's account and key are its published dev credentials, not a secret; the GCS test makes its own throwaway key.
  object-stores:
    needs: changes
    if: needs.changes.outputs.object_stores == 'true'
    runs-on: ubuntu-latest
    env:
      FLOE_AZURITE_ENDPOINT: http://localhost:10000/devstoreaccount1
      AZURE_STORAGE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      FLOE_GCS_EMULATOR: http://localhost:4443
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          # any HTTP answer (000 means nothing listens yet) means the blob service is up
          timeout 60 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" localhost:10000/devstoreaccount1)" != 000 ]; do sleep 1; done'
          az storage container create --name warehouse --connection-string \
            "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=$AZURE_STORAGE_ACCOUNT_KEY;BlobEndpoint=$FLOE_AZURITE_ENDPOINT;"
      - run: uv run pytest -m adls -rs --junitxml=junit-adls.xml tests/integration
      - run: uv run python scripts/assert_tests_ran.py junit-adls.xml
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -scheme http -port 4443 -public-host localhost:4443 -backend memory
          timeout 60 sh -c 'until curl -sf localhost:4443/storage/v1/b >/dev/null; do sleep 1; done'
          curl -sS --fail-with-body -X POST localhost:4443/storage/v1/b -H 'Content-Type: application/json' -d '{"name": "warehouse"}'
      - run: uv run pytest -m gcs -rs --junitxml=junit-gcs.xml tests/integration
      - run: uv run python scripts/assert_tests_ran.py junit-gcs.xml
      - name: Container logs
        if: failure()
        run: |
          docker logs azurite
          docker logs fake-gcs

  # Nightly and on demand only: Glue (moto) and the memory regression need no harness.
  glue:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FLOE_GLUE_ENDPOINT: http://localhost:5055
      FLOE_S3_ENDPOINT: http://localhost:5055
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      # moto serves Glue and S3 on one port; its own tool environment keeps it out of the project's lockfile
      - name: Start moto
        run: |
          uvx --from "moto[server]==5.2.5" moto_server -p 5055 > moto.log 2>&1 &
          timeout 60 sh -c 'until curl -s localhost:5055 >/dev/null; do sleep 1; done'
      - run: uv run pytest -m glue -rs tests/integration
      - name: Moto log
        if: failure()
        run: cat moto.log

  perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest -m perf tests/perf
      # the run summary (runtime, startup, peak RSS per step) is in the log: -rP prints it
      - run: uv run pytest -m "scale and not polaris" -rP tests/scale

  # The one required check. Always runs (even when a job above failed or was skipped) and fails unless every job
  # `changes` selected succeeded; a job that was not selected must have been skipped.
  integration-gate:
    needs: [changes, polaris, object-stores]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check selected jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          POLARIS_SELECTED: ${{ needs.changes.outputs.polaris }}
          POLARIS: ${{ needs.polaris.result }}
          OBJECT_STORES_SELECTED: ${{ needs.changes.outputs.object_stores }}
          OBJECT_STORES: ${{ needs.object-stores.result }}
        run: |
          fail=0
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; fail=1; }
          check() { # name selected result
            want=skipped; [ "$2" = true ] && want=success
            [ "$3" = "$want" ] || { echo "$1: $3, expected $want"; fail=1; }
          }
          check polaris "$POLARIS_SELECTED" "$POLARIS"
          check object-stores "$OBJECT_STORES_SELECTED" "$OBJECT_STORES"
          exit $fail
