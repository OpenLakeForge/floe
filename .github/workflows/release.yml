name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the wheel and the image, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write   # PyPI OIDC trusted publisher

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      on_main: ${{ steps.guard.outputs.on_main }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - id: guard
        name: Ensure tag is on main
        run: |
          git fetch origin main --quiet
          # Branch dispatches (dry-run testing) skip the ancestry check —
          # publishing is already blocked on those by ref_type == 'tag'.
          # Tag dispatches and tag pushes must still pass the ancestry check.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate pyproject version matches tag
    runs-on: ubuntu-latest
    needs: meta
    if: ${{ needs.meta.outputs.on_main == 'true' }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - shell: python
        run: |
          import os, sys, tomllib

          # A branch dispatch (dry run) has no tag to compare against.
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              sys.exit(0)
          with open("pyproject.toml", "rb") as f:
              found = tomllib.load(f)["project"]["version"]
          if found != os.environ["VERSION"]:
              sys.exit(f"pyproject.toml version {found!r} != tag {os.environ['VERSION']!r}; bump it in a chore PR before tagging.")
          print(f"OK: floe-python {found}")

  build:
    name: Build floe-python
    runs-on: ubuntu-latest
    needs: [meta, validate]
    if: ${{ needs.meta.outputs.on_main == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # Pure Python: the wheel is py3-none-any and installs a working `floe` command.
      - name: Smoke-test the wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*-py3-none-any.whl
          "$RUNNER_TEMP/venv/bin/floe" --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish floe-python to PyPI
    needs: [meta, build]
    if: ${{ needs.meta.outputs.on_main == 'true' && github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Floe v${{ needs.meta.outputs.version }}
          files: dist/*

  docker:
    name: Publish Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: [meta, validate]
    if: ${{ needs.meta.outputs.on_main == 'true' }}
    env:
      # A branch dispatch has no version, so its dry-run build gets a placeholder tag.
      VERSION: ${{ github.ref_type == 'tag' && needs.meta.outputs.version || 'dry-run' }}
      PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.python
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          # GHCR names must be lowercase; github.repository_owner is OpenLakeForge.
          tags: |
            ghcr.io/openlakeforge/floe:${{ env.VERSION }}
            ghcr.io/openlakeforge/floe:latest
          cache-from: type=gha,scope=python-image
          cache-to: type=gha,mode=max,scope=python-image
