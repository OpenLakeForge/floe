[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floe-python"
version = "0.8.0"
description = "Floe: a data-contract runtime for file ingestion"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.118",
    "duckdb==1.5.6",
    "fastexcel>=0.21.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyiceberg>=0.12.0",
    "pyiceberg-core>=0.10.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
floe = "floe._cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]
conformance = ["pyarrow"]

[tool.hatch.build.targets.wheel]
packages = ["src/floe"]

[tool.ruff]
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "conformance/**/*.py"]

[tool.pyright]
include = ["src", "tests", "conformance"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "polaris: needs a running Polaris, enabled by FLOE_POLARIS_URI",
    "s3: needs an S3-compatible service (set FLOE_S3_ENDPOINT)",
]
