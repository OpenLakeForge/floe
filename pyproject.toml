[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floe-python"
version = "0.10.0"
description = "Floe: a data-contract runtime for file ingestion"
requires-python = ">=3.11"
dependencies = [
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
s3 = ["boto3>=1.36.0"]
iceberg = ["pyiceberg>=0.12.0", "pyiceberg-core>=0.10.1"]
merge = ["duckdb==1.5.6"]
xlsx = ["fastexcel>=0.21.0"]
all = ["floe-python[s3,iceberg,merge,xlsx]"]

[project.scripts]
floe = "floe._cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]
conformance = ["pyarrow"]

[tool.hatch.build.targets.wheel]
packages = ["src/floe"]

[tool.ruff]
src = ["src", "tests", "orchestrators/dagster-floe/src", "orchestrators/airflow-floe/src"]
include = ["src/**/*.py", "tests/**/*.py", "conformance/**/*.py", "orchestrators/dagster-floe/**/*.py", "orchestrators/airflow-floe/**/*.py"]

[tool.pyright]
include = ["src", "tests", "conformance"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# perf and scale run on their own (`pytest -m perf`, `-m scale`); a later -m on the command line replaces this one
addopts = "-m 'not perf and not scale'"
markers = [
    "perf: memory regression run, slow; nightly only (-m perf)",
    "scale: a generated 200-entity project, slow; nightly only (-m scale), with -m polaris an Iceberg subset",
    "polaris: needs a running Polaris, enabled by FLOE_POLARIS_URI",
    "s3: needs an S3-compatible service (set FLOE_S3_ENDPOINT)",
    "glue: needs a Glue-compatible service and S3 (set FLOE_GLUE_ENDPOINT, FLOE_S3_ENDPOINT)",
]

[tool.coverage.report]
# the measured total was 94.97% when #1063 set it; raise it, never lower it
fail_under = 94
