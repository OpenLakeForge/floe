version: "0.3"

entities:
  - name: orders
    source:
      format: xlsx
      path: "./in/orders.xlsx"
      options:
        sheet: orders
        header_row: 2
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/orders"
      rejected:
        format: csv
        path: "./out/rejected/orders"
    policy:
      severity: reject
    schema:
      columns:
        - name: id
          type: string
        - name: amount
          type: string
        - name: active
          type: string
        - name: note
          type: string
        - name: id_dup_2
          type: string

report:
  path: "./report"
