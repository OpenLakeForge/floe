version: "0.3"
domains:
  - name: spike
entities:
  - name: typed_int8
    domain: spike
    source:
      format: parquet
      path: "./in/casts_typed.parquet"
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/typed_int8"
      rejected:
        format: csv
        path: "./out/rejected/typed_int8"
    policy:
      severity: reject
    schema:
      columns:
        - name: id
          type: string
          nullable: false
        - name: i64
          type: int8
        - name: u64
          type: int8
        - name: f64
          type: int8
        - name: b
          type: int8
        - name: d
          type: int8
        - name: ts
          type: int8
        - name: tstz
          type: int8
        - name: tzp
          type: int8
