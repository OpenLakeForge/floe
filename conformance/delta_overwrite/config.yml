version: "0.3"
domains:
  - name: spike
entities:
  - name: scores
    domain: spike
    source:
      format: csv
      path: "./in"
      options: { header: true, separator: "," }
    sink:
      write_mode: overwrite
      accepted:
        format: delta
        path: "./out/accepted/scores"
      rejected:
        format: csv
        path: "./out/rejected/scores"
    policy:
      severity: reject
    schema:
      columns:
        - { name: id, type: int64, nullable: false }
        - { name: name, type: string, nullable: false }
        - { name: qty, type: uint8 }
        - { name: score, type: number }
report:
  path: "./report"
