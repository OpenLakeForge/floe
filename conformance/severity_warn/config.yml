version: "0.3"
domains:
  - name: spike
entities:
  - name: orders
    domain: spike
    source:
      format: csv
      path: "./in"
      options:
        header: true
        separator: ","
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/orders"
      rejected:
        format: csv
        path: "./out/rejected/orders"
    policy:
      severity: warn
    schema:
      unique_keys:
        - [id]
      columns:
        - name: id
          type: int64
          nullable: false
        - name: name
          type: string
          nullable: false
        - name: qty
          type: int64
report:
  path: "./report"
