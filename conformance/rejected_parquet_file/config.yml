version: "0.3"
domains:
  - name: spike
entities:
  - name: orders
    domain: spike
    source:
      format: parquet
      path: "./in"
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/orders"
      rejected:
        format: parquet
        path: "./out/rejected/orders"
    policy:
      severity: reject
    schema:
      mismatch:
        missing_columns: reject_file
      columns:
        - name: id
          type: int64
        - name: name
          type: string
        - name: gone
          type: string
report:
  path: "./report"
