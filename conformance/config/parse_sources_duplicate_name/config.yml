version: '0.3'
sources:
- name: lake
  format: csv
  path: in/{{resource}}.csv
- name: lake
  format: csv
  path: x
entities:
- name: orders
  source:
    ref: lake
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
