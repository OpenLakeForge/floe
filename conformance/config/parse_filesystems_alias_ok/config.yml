version: '0.1'
entities:
- name: orders
  source:
    format: csv
    path: in/orders.csv
    filesystem: l
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
filesystems:
  default: l
  definitions:
  - name: l
    type: local
