version: '0.1'
entities:
- name: orders
  source:
    format: json
    path: in/orders.json
    options:
      json_mode: lines
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
