version: '0.3'
entities:
- name: orders
  source:
    format: csv
    path: in/orders.csv
  sink:
    accepted:
      format: parquet
      path: out/accepted
    rejected:
      format: csv
      path: out/rejected
  policy:
    severity: warn
    rule_severity:
      unique: abort
  schema:
    columns:
    - name: id
      type: string
  pii:
    columns:
    - name: id
      strategy: hash
