version: '0.1'
entities:
- name: orders
  source:
    format: csv
    path: in
    options:
      recursive: true
    partitioning:
      pattern: '{yyyy}/{MM}/{batch}'
      date_column: ingest_date
      batch_column: batch_id
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
