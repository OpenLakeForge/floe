version: '0.1'
entities:
- name: orders
  source:
    format: csv
    path: in/orders.csv
  sink:
    accepted:
      format: delta
      path: out/accepted
      merge:
        compare_columns:
        - amt
    write_mode: merge_scd1
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
    primary_key:
    - id
