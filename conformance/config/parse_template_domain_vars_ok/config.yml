version: '0.3'
domains:
- name: sales
  defaults:
    sink:
      accepted:
        format: parquet
        path: out/accepted/{{domain.name}}/{{entity.name}}
    policy:
      severity: warn
  incoming_dir: landing
entities:
- name: orders
  domain: sales
  source:
    format: csv
    path: '{{domain.incoming_dir}}/{{domain.name}}/orders.csv'
  schema:
    columns:
    - name: id
      type: string
