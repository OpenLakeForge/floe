version: '0.2'
entities:
- name: orders
  source:
    format: csv
    path: in/orders.csv
  sink:
    accepted:
      format: iceberg
      path: out/accepted
      iceberg:
        catalog: c
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
    schema_evolution:
      mode: add_columns
storages:
  default: s3
  definitions:
  - name: s3
    type: s3
    bucket: b
    region: r
catalogs:
  default: c
  definitions:
  - name: c
    type: rest
    uri: http://catalog.example
