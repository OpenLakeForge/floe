version: '0.1'
entities:
- name: orders
  source:
    format: csv
    path: in
    options:
      recursive: true
    partitioning:
      pattern: 'year={yyyy}/month={MM}/day={dd}/hour={HH}'
      date_column: ingest_date
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
    - name: amt
      type: number
