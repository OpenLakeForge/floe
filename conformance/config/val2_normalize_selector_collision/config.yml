version: '0.1'
entities:
- name: orders
  source:
    format: json
    path: in/orders.json
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    normalize_columns:
      enabled: true
    columns:
    - name: order_id
      type: string
    - name: order_ref
      type: string
      source: order.id
