version: '0.1'
entities:
- name: orders
  source:
    format: fixed
    path: in/orders.csv
  sink:
    accepted:
      format: parquet
      path: out/accepted
  policy:
    severity: warn
  schema:
    columns:
    - name: id
      type: string
      width: 3
    - name: amt
      type: number
      width: 3
