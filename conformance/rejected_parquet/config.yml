version: "0.3"
domains:
  - name: spike
entities:
  - name: orders
    domain: spike
    source:
      format: csv
      path: "./in"
      options: {header: true, separator: ","}
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/orders"
      rejected:
        format: parquet
        path: "./out/rejected/orders"
    policy:
      severity: reject
    schema:
      columns:
        - {name: id, type: int64, nullable: false, unique: true}
        - {name: day, type: date}
        - {name: amount, type: "decimal(10,2)"}
        - {name: note, type: string}
report:
  path: "./report"
