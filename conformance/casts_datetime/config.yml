version: "0.3"
domains:
  - name: spike
entities:
  - name: casts_datetime
    domain: spike
    source:
      format: csv
      path: "./in/casts_datetime.csv"
      options:
        header: true
        separator: ","
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/casts_datetime"
      rejected:
        format: csv
        path: "./out/rejected/casts_datetime"
    policy:
      severity: reject
    schema:
      columns:
        - name: id
          type: string
          nullable: false
        - name: date
          type: date
        - name: datetime
          type: datetime
        - name: timestamp
          type: timestamp
report:
  path: "./report"
