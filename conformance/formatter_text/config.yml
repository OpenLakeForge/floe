version: "0.3"
domains:
  - name: spike
entities:
  - name: orders
    domain: spike
    source:
      format: csv
      path: "./in"
      options: {header: true, separator: ","}
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/orders"
      rejected:
        format: csv
        path: "./out/rejected/orders"
    policy:
      severity: reject
    schema:
      columns:
        - { name: id, type: int64, nullable: false }
        - { name: qty, type: int64 }
        - { name: email, type: string, nullable: false }
report:
  path: "./report"
  formatter: text
