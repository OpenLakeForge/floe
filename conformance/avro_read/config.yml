version: "0.3"
domains:
  - name: spike
entities:
  - name: avro_read
    domain: spike
    source:
      format: avro
      path: "./in/avro_read.avro"
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/avro_read"
      rejected:
        format: csv
        path: "./out/rejected/avro_read"
    policy:
      severity: reject
    schema:
      columns:
        - name: id
          type: string
          nullable: false
        - name: qty
          type: int64
          nullable: false
        - name: price
          type: number
        - name: active
          type: boolean
        - name: note
          type: string
report:
  path: "./report"
