version: "0.3"
domains:
  - name: spike
entities:
  - name: parts
    domain: spike
    source:
      format: csv
      path: "./in/part_*.csv"
      options:
        header: true
        separator: ","
    sink:
      accepted:
        format: parquet
        path: "./out/accepted/parts"
      rejected:
        format: csv
        path: "./out/rejected/parts"
    policy:
      severity: reject
    schema:
      columns:
        - { name: id, type: int64 }
        - { name: name, type: string }
report:
  path: "./report"
